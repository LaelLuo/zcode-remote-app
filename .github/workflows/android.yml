name: Android CI

on:
  push:
    branches: [release]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew executable
        run: chmod +x app/gradlew

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "STORE_FILE=$PWD/app/release.keystore" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release APKs (ABI splits)
        run: cd app && ./gradlew assembleRelease --no-daemon

      - name: Check signing
        run: |
          ls app/app/build/outputs/apk/release/*.apk
          for apk in app/app/build/outputs/apk/release/*.apk; do
            if "$ANDROID_HOME/build-tools"/*/apksigner verify --print-certs "$apk" 2>/dev/null | grep -q "CN=Android Debug"; then
              echo "::error::$apk 用的是 debug 签名——请配置仓库 Secrets（KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD）"
              exit 1
            fi
          done

      - name: Upload artifacts (branch push)
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/app/build/outputs/apk/release/*.apk
